site_name: Victoria ERP — Documentación
site_description: Documentación general, de arquitectura y funcional de Victoria ERP
docs_dir: docs
theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Modo oscuro }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Modo claro }
markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
nav:
  - Inicio: index.md
  - General:
      - Qué es Victoria ERP: general/index.md
      - Glosario: general/glosario.md
  - Arquitectura:
      - Visión general: arquitectura/index.md
      - Convenciones: arquitectura/convenciones.md
  - Decisiones (ADR):
      - ADR-001 Stack tecnológico: adr/0001-stack.md
      - ADR-002 Arquitectura: adr/0002-arquitectura.md
      - ADR-003 Infraestructura a costo cero: adr/0003-infraestructura.md
      - ADR-004 Base contable configurable: adr/0004-base-contable.md
      - ADR-005 Atributos adicionales: adr/0005-atributos-adicionales.md
  - Módulos:
      - Índice: modulos/index.md
      - Seguridad: modulos/seguridad.md
      - Maestros: modulos/maestros.md
      - Contabilidad base: modulos/contabilidad.md
  - Países:
      - Índice: paises/index.md
      - Perú: paises/peru.md
