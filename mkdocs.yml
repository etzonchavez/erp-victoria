site_name: ERP Victoria — Documentación
site_description: Documentación general, de arquitectura y funcional de ERP Victoria
docs_dir: docs
theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Modo oscuro }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Modo claro }
markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
nav:
  - Inicio: index.md
  - General:
      - Qué es ERP Victoria: general/index.md
      - Glosario: general/glosario.md
  - Arquitectura:
      - Visión general: arquitectura/index.md
      - Convenciones: arquitectura/convenciones.md
  - Decisiones (ADR):
      - ADR-001 Stack tecnológico: adr/0001-stack.md
      - ADR-002 Arquitectura: adr/0002-arquitectura.md
      - ADR-003 Infraestructura a costo cero: adr/0003-infraestructura.md
  - Módulos:
      - Índice: modulos/index.md
      - Seguridad: modulos/seguridad.md
  - Países: paises/index.md
